server:
  port: ${PORT:8080}

spring:
  application:
    name: business-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remote_sensing_agent}
    username: ${SPRING_DATASOURCE_USERNAME:agent}
    password: ${SPRING_DATASOURCE_PASSWORD:agent-local-only}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

demo:
  faults:
    enabled: ${DEMO_FAULTS_ENABLED:false}
    max-delay-ms: ${DEMO_FAULT_MAX_DELAY_MS:2000}
    timeout-delay-ms: ${DEMO_FAULT_TIMEOUT_DELAY_MS:5000}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
