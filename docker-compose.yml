name: ${COMPOSE_PROJECT_NAME:-remote-sensing-agent}

services:
  # postgres 服务
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_sensing_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # java 服务
  business-service:
    build:
      context: ./business-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-remote_sensing_agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agent-local-only}
      DEMO_FAULTS_ENABLED: ${DEMO_FAULTS_ENABLED:-true}
      DEMO_FAULT_MAX_DELAY_MS: ${DEMO_FAULT_MAX_DELAY_MS:-2000}
      DEMO_FAULT_TIMEOUT_DELAY_MS: ${DEMO_FAULT_TIMEOUT_DELAY_MS:-5000}
    ports:
      - "${BUSINESS_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
  # python 服务
  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    environment:
      PORT: 8000
      ENVIRONMENT: development
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      BUSINESS_SERVICE_URL: http://business-service:8080
      BUSINESS_CONNECT_TIMEOUT_SECONDS: ${BUSINESS_CONNECT_TIMEOUT_SECONDS:-2.0}
      BUSINESS_READ_TIMEOUT_SECONDS: ${BUSINESS_READ_TIMEOUT_SECONDS:-3.0}
      BUSINESS_WRITE_TIMEOUT_SECONDS: ${BUSINESS_WRITE_TIMEOUT_SECONDS:-3.0}
      BUSINESS_POOL_TIMEOUT_SECONDS: ${BUSINESS_POOL_TIMEOUT_SECONDS:-1.0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent-local-only}@postgres:5432/${POSTGRES_DB:-remote_sensing_agent}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai_compatible}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.0}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-2048}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30.0}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-1}
      MODEL_INITIAL_BACKOFF_SECONDS: ${MODEL_INITIAL_BACKOFF_SECONDS:-0.2}
      MODEL_MAX_BACKOFF_SECONDS: ${MODEL_MAX_BACKOFF_SECONDS:-2.0}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_INITIAL_BACKOFF_SECONDS: ${EMBEDDING_INITIAL_BACKOFF_SECONDS:-0.2}
      EMBEDDING_MAX_BACKOFF_SECONDS: ${EMBEDDING_MAX_BACKOFF_SECONDS:-2.0}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30.0}
      EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-text-embedding-3-small-1536-v1}
    ports:
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      business-service:
        condition: service_started
    init: true
    restart: unless-stopped
  # web-console 服务
  web-console:
    build:
      context: ./web-console
    environment:
      PORT: 5173
      BUSINESS_API_URL: http://business-service:8080
      AGENT_API_URL: http://agent-service:8000
    ports:
      - "${WEB_CONSOLE_PORT:-5173}:5173"
    depends_on:
      agent-service:
        condition: service_started
      business-service:
        condition: service_started
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
